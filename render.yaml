# Optional Render Blueprint — create a Worker service
services:
  - type: worker
    name: mega-bot-telegram
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mega-bot-db
          property: connectionString
      - key: OWNER_ID
        sync: false
      - key: BOT_USERNAME
        sync: false
